# ============================================================
# KITTY
# ============================================================

# ---------- Fonte ----------
font_family      font_family JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 15.0

# ---------- Cursor ----------
cursor_shape block
cursor_blink_interval 0.5

# ---------- Janela ----------
window_padding_width 10

# Como o Niri já controla as janelas, não precisamos de
# decorações adicionais do Kitty.
hide_window_decorations yes

# ---------- Scrollback ----------
scrollback_lines 10000

# ---------- Mouse ----------
mouse_hide_wait 3.0
url_style curly
open_url_with default

# ---------- Bell ----------
enable_audio_bell no
visual_bell_duration 0.0

# ---------- Shell integration ----------
shell_integration enabled

# ---------- Tabs ----------
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"
active_tab_font_style bold
inactive_tab_font_style normal

# ---------- Layouts ----------
enabled_layouts splits,stack,tall,fat,grid

# ---------- Confirmação ao fechar ----------
confirm_os_window_close 0


# ============================================================
# ATALHOS
# ============================================================

# Nova aba
map ctrl+shift+t new_tab

# Fechar aba
map ctrl+shift+q close_tab

# Navegar pelas abas
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

# Novo terminal dentro da aba
map ctrl+shift+enter new_window

# Navegar entre splits
map ctrl+shift+up neighboring_window up
map ctrl+shift+down neighboring_window down

# Alternar layouts
map ctrl+shift+l next_layout

# Zoom temporário no terminal atual
map ctrl+shift+z toggle_layout stack

# Configuração
map ctrl+shift+f2 edit_config_file
map ctrl+shift+f5 load_config_file

# Maximizar/restaurar o split atual
map ctrl+shift+f11 toggle_layout stack

# BEGIN_KITTY_THEME
# Catppuccin-Macchiato
include current-theme.conf
# END_KITTY_THEME
